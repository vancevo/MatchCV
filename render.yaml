services:
  - type: web
    name: talentflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - { key: PYTHON_VERSION, value: 3.12.7 }
      - { key: APP_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: RESUME_STORAGE_BACKEND, value: supabase }
      - { key: RESUME_STORAGE_BUCKET, value: resumes }
      - { key: RESUME_SIGNED_URL_TTL_SECONDS, value: 300 }
      - { key: MASTER_EMAIL, sync: false }
      - { key: MASTER_PASSWORD, sync: false }
      - { key: MASTER_FULL_NAME, value: "Master Admin" }
      - { key: MASTER_SEED_ON_START, value: "true" }
      - { key: AUTH_REQUIRED, value: "true" }
      - { key: AUTO_SEED, value: "false" }
      - { key: CORS_ORIGINS, sync: false }
      - { key: OPENROUTER_API_KEY, sync: false }
      - { key: OPENROUTER_MODEL, value: google/gemini-2.5-flash-lite }
      - { key: MAX_UPLOAD_MB, value: 10 }
      - { key: QUEUE_EAGER, value: "true" }
      - { key: ALLOW_EAGER_REAL_INTEGRATIONS, value: "true" }
      - { key: INTEGRATION_PROVIDER, value: google }
      - { key: PUBLIC_APP_URL, value: "https://talentflow-frontend-yifc.onrender.com" }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: GOOGLE_REDIRECT_URI, value: "https://talentflow-backend-e5nx.onrender.com/api/integrations/google/callback" }
      - { key: INTEGRATION_TOKEN_SECRET, sync: false }
      - { key: OAUTH_STATE_SECRET, sync: false }
      - { key: PROVIDER_WEBHOOK_SECRET, sync: false }
      - { key: TASK_MAX_ATTEMPTS, value: 3 }
      - { key: TASK_TIMEOUT_SECONDS, value: 120 }
  - type: web
    name: talentflow-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - { key: NODE_VERSION, value: 22.19.0 }
      - { key: NEXT_PUBLIC_API_URL, sync: false }
      - { key: NEXT_PUBLIC_SUPABASE_URL, sync: false }
      - { key: NEXT_PUBLIC_SUPABASE_ANON_KEY, sync: false }
