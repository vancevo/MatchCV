services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://recruitment:recruitment@postgres:5432/recruitment
      APP_ENV: ${APP_ENV:-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-minimax/minimax-m3:free}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTO_SEED: ${AUTO_SEED:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      INTEGRATION_PROVIDER: ${INTEGRATION_PROVIDER:-local}
      INTEGRATION_TOKEN_SECRET: ${INTEGRATION_TOKEN_SECRET:-talentflow-local-token-key}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-talentflow-local-oauth-state}
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-}
      OPERATIONAL_SWEEP_INTERVAL_MINUTES: ${OPERATIONAL_SWEEP_INTERVAL_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/integrations/google/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/integrations/microsoft/callback}
      REDIS_URL: redis://redis:6379/0
      QUEUE_EAGER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: rq worker --with-scheduler --url redis://redis:6379/0 talentflow-screening
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://recruitment:recruitment@postgres:5432/recruitment
      APP_ENV: ${APP_ENV:-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-minimax/minimax-m3:free}
      AUTO_SEED: "false"
      REDIS_URL: redis://redis:6379/0
      QUEUE_EAGER: "false"
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-120}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      INTEGRATION_PROVIDER: ${INTEGRATION_PROVIDER:-local}
      INTEGRATION_TOKEN_SECRET: ${INTEGRATION_TOKEN_SECRET:-talentflow-local-token-key}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-talentflow-local-oauth-state}
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-}
      OPERATIONAL_SWEEP_INTERVAL_MINUTES: ${OPERATIONAL_SWEEP_INTERVAL_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/integrations/google/callback}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/integrations/microsoft/callback}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
