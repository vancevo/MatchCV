services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://recruitment:recruitment@postgres:5432/recruitment
      APP_ENV: ${APP_ENV:-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash-lite}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      AUTO_SEED: ${AUTO_SEED:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      INTEGRATION_PROVIDER: ${INTEGRATION_PROVIDER:-local}
      INTEGRATION_TOKEN_SECRET: ${INTEGRATION_TOKEN_SECRET:-talentflow-local-token-key}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-talentflow-local-oauth-state}
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-}
      OPERATIONAL_SWEEP_INTERVAL_MINUTES: ${OPERATIONAL_SWEEP_INTERVAL_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/integrations/google/callback}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_MODEL_PATH: /app/models/bge-m3
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      CANDIDATE_SEARCH_LEXICAL_WEIGHT: ${CANDIDATE_SEARCH_LEXICAL_WEIGHT:-0.20}
      CV_WAREHOUSE_ENABLED: ${CV_WAREHOUSE_ENABLED:-true}
      CV_WAREHOUSE_API_URL: http://cv-warehouse-backend:8100
      CV_WAREHOUSE_API_KEY: ${CV_WAREHOUSE_API_KEY:-local-cv-warehouse-key}
      CV_WAREHOUSE_TIMEOUT_SECONDS: ${CV_WAREHOUSE_TIMEOUT_SECONDS:-20}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_MODEL_PATH: /app/models/bge-reranker-v2-m3
      RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-cpu}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-256}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-8}
      RERANKER_TOP_K: ${RERANKER_TOP_K:-20}
      RERANKER_WEIGHT: ${RERANKER_WEIGHT:-0.70}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/integrations/microsoft/callback}
      REDIS_URL: redis://redis:6379/0
      QUEUE_EAGER: "false"
    volumes:
      - ./backend/models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cv-warehouse-frontend:
    build: ./cv-warehouse/frontend
    ports: ["3100:3100"]
    environment:
      NEXT_PUBLIC_CV_WAREHOUSE_API_URL: http://localhost:8100
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    depends_on: [cv-warehouse-backend]

  cv-warehouse-backend:
    build: ./cv-warehouse/backend
    ports: ["8100:8100"]
    environment:
      DATABASE_URL: postgresql://cvwarehouse:cvwarehouse@cv-postgres:5432/cvwarehouse
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      CV_WAREHOUSE_API_KEY: ${CV_WAREHOUSE_API_KEY:-local-cv-warehouse-key}
      DEFAULT_TENANT_ID: ${CV_WAREHOUSE_DEFAULT_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      EMBEDDING_ENABLED: ${CV_WAREHOUSE_EMBEDDING_ENABLED:-true}
      EMBEDDING_MODEL_PATH: /app/models/bge-m3
      RERANKER_ENABLED: ${CV_WAREHOUSE_RERANKER_ENABLED:-false}
      RERANKER_MODEL_PATH: /app/models/bge-reranker-v2-m3
      CORS_ORIGINS: http://localhost:3100,http://localhost:3000
    volumes:
      - cv_warehouse_uploads:/app/uploads
      - ./backend/models:/app/models:ro
    depends_on:
      cv-postgres:
        condition: service_healthy

  cv-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cvwarehouse
      POSTGRES_USER: cvwarehouse
      POSTGRES_PASSWORD: cvwarehouse
    volumes: [cv_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvwarehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    command: rq worker --with-scheduler --url redis://redis:6379/0 talentflow-screening
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://recruitment:recruitment@postgres:5432/recruitment
      APP_ENV: ${APP_ENV:-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash-lite}
      AUTO_SEED: "false"
      REDIS_URL: redis://redis:6379/0
      QUEUE_EAGER: "false"
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-120}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      INTEGRATION_PROVIDER: ${INTEGRATION_PROVIDER:-local}
      INTEGRATION_TOKEN_SECRET: ${INTEGRATION_TOKEN_SECRET:-talentflow-local-token-key}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-talentflow-local-oauth-state}
      PROVIDER_WEBHOOK_SECRET: ${PROVIDER_WEBHOOK_SECRET:-}
      OPERATIONAL_SWEEP_INTERVAL_MINUTES: ${OPERATIONAL_SWEEP_INTERVAL_MINUTES:-15}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/integrations/google/callback}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_MODEL_PATH: /app/models/bge-m3
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-5617a9f61b028005a4858fdac845db406aefb181}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-http://localhost:8000/api/integrations/microsoft/callback}
    volumes:
      - ./backend/models:/app/models:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: recruitment
      POSTGRES_PASSWORD: recruitment
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  cv_postgres_data:
  cv_warehouse_uploads:
