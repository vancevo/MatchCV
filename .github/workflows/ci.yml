name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # backend/requirements.txt pulls in full GPU torch + CUDA wheels (~4GB); the runner's
      # default free space is too tight for that on top of its preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
          AUTO_SEED: "false"
      - run: pytest -q
        working-directory: backend
      - run: python -m evals.run_baseline
        working-directory: backend
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker build -t talentflow-backend ./backend
      - run: docker build -t talentflow-frontend ./frontend
